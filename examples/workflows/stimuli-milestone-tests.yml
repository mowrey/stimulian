# CLIENT repo: .github/workflows/stimuli-milestone-tests.yml
# Runs the contractor's code on the pull request with no secrets.
# The job name "milestone-tests" is the check the milestone spec requires.
name: stimuli-milestone-tests
on: pull_request
permissions: { contents: read }
jobs:
  milestone-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npm test
